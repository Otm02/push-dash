<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PUSH//DASH</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 24px 0 12px;
      font-size: 2.5rem;
      font-weight: bold;
      letter-spacing: 2px;
      color: #fff;
    }

    #lobby {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      background-color: #111;
      border-top: 1px solid #222;
      border-bottom: 1px solid #333;
    }

    #lobby button,
    #lobby input {
      padding: 10px 16px;
      background-color: #222;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      font-size: 1rem;
      min-width: 200px;
      text-align: center;
      outline: none;
    }

    #lobby button:hover {
      background-color: #333;
      border-color: #666;
      cursor: pointer;
    }

    #lobby input::placeholder {
      color: #666;
    }

    #status {
      margin-top: 8px;
      color: #888;
      font-size: 0.9em;
    }

    #game {
      flex-grow: 1;
      width: 100%;
    }
  </style>
</head>

<body>
  <header>PUSH//DASH</header>

  <div id="lobby">
    <button id="quickplay">Quickplay</button>
    <input id="roomIdInput" placeholder="Room ID" />
    <button id="joinById">Join by ID</button>
    <span id="status"></span>
  </div>

  <div id="game"></div>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
