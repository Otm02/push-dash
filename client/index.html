<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PUSH//DASH</title>
    <meta name="description" content="PUSH//DASH – a fast-paced, neon-arena brawler. Dash, collide, survive." />
    <link rel="stylesheet" href="./assets/styles.css" />
</head>

<body>
    <div class="bg"></div>



    <div class="shell">
        <div class="card">
            <div class="leftStack">
                <div class="hero">
                    <h1>PUSH<span class="sep">//</span>DASH</h1>
                    <p>Ready up with friends and collide in a minimalist neon arena. Short taps, long dashes—master
                        momentum.</p>
                    <div class="cta-row">
                        <input id="nameInput" class="input" placeholder="Your Name (optional)" />
                        <button id="quickplay" class="btn">Quickplay</button>
                    </div>
                </div>
                <div class="panel">
                    <h3>Join a Room</h3>
                    <div class="row">
                        <input id="roomIdInput" class="input" placeholder="Room ID" />
                        <button id="joinById" class="btn secondary">Join by ID</button>
                    </div>
                    <div class="row">
                        <span id="status" class="hint"></span>
                    </div>
                </div>
                <div id="hud">
                    <div class="readyOnly"><button id="readyBtn" class="btn">Ready</button></div>
                    <div class="statusPanel">
                        <span id="readyInfo"></span>
                        <span id="scoreInfo"></span>
                    </div>
                </div>
            </div>
            <div class="rightArena">
                <div id="game"></div>
            </div>
        </div>
        <div id="lobby" style="display:none"></div>
    </div>

    <div id="gameover">
        <div class="modal">
            <div id="winnerText">Winner: -</div>
            <div id="scoreBoard"></div>
            <div id="rematchInfo">Rematch: 0 / 0</div>
            <div class="row" style="justify-content:center;">
                <button id="rematchBtn" class="btn">Rematch</button>
                <button id="menuBtn" class="btn secondary">Main Menu</button>
            </div>
        </div>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>

</html>
